<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="redBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#dc2626" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Red Accent circle inside -->
  <circle cx="64" cy="64" r="48" fill="url(#redBadge)" opacity="0.15" />

  <!-- Iconic Chery Emblem Silhouette -->
  <g filter="url(#glow)">
    <!-- Outer Oval Ring -->
    <path d="M 64 28 C 38 28 18 44 18 64 C 18 84 38 100 64 100 C 90 100 110 84 110 64 C 110 44 90 28 64 28 Z M 64 36 C 84 36 100 48.5 100 64 C 100 79.5 84 92 64 92 C 44 92 28 79.5 28 64 C 28 48.5 44 36 64 36 Z" fill="url(#chromeGrad)" />

    <!-- Center Chery Stylized Arch / Apex (A shape inside oval) -->
    <path d="M 64 38 L 76 68 L 86 68 L 68 34 C 66 30 62 30 60 34 L 42 68 L 52 68 Z" fill="url(#chromeGrad)" />
    
    <!-- Central Horizontal Wing / Bar connecting wings -->
    <path d="M 38 66 L 90 66 C 92 66 94 67.5 94 69.5 C 94 71.5 92 73 90 73 L 38 73 C 36 73 34 71.5 34 69.5 C 34 67.5 36 66 38 66 Z" fill="url(#chromeGrad)" />
    <path d="M 52 73 L 42 90 L 52 90 L 58 76 L 70 76 L 76 90 L 86 90 L 76 73 Z" fill="url(#chromeGrad)" opacity="0.9" />
  </g>
</svg>
