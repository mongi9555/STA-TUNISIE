    <!-- Polyfills and Legacy Compatibility Script for Windows 8 & Older Browsers -->
    <script>
      (function() {
        // 1. globalThis polyfill
        if (typeof globalThis === 'undefined') {
          window.globalThis = window;
        }

        // 2. crypto and crypto.randomUUID polyfill
        if (!window.crypto) {
          window.crypto = {};
        }
        if (!window.crypto.randomUUID) {
          window.crypto.randomUUID = function() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
              var r = (Math.random() * 16) | 0;
              var v = c === 'x' ? r : (r & 0x3) | 0x8;
              return v.toString(16);
            });
          };
        }

        // 3. String.prototype.replaceAll polyfill
        if (!String.prototype.replaceAll) {
          String.prototype.replaceAll = function(str, newStr) {
            if (Object.prototype.toString.call(str).toLowerCase() === '[object regexp]') {
              return this.replace(str, newStr);
            }
            return this.replace(new RegExp(str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'), newStr);
          };
        }

        // 4. Array.prototype.flat polyfill
        if (!Array.prototype.flat) {
          Array.prototype.flat = function(depth) {
            var flt = function(arr, d) {
              return d > 0
                ? arr.reduce(function(acc, val) {
                    return acc.concat(Array.isArray(val) ? flt(val, d - 1) : val);
                  }, [])
                : arr.slice();
            };
            return flt(this, depth === undefined ? 1 : Number(depth));
          };
        }

        // 5. Detect Internet Explorer or unsupported legacy browsers
        var ua = window.navigator.userAgent;
        var isIE = ua.indexOf('MSIE ') > -1 || ua.indexOf('Trident/') > -1;
        var supportsESModules = 'noModule' in document.createElement('script');

        if (isIE || !supportsESModules) {
          window.__IS_LEGACY_BROWSER__ = true;
          window.addEventListener('DOMContentLoaded', function() {
            var rootEl = document.getElementById('root');
            if (rootEl) {
              rootEl.innerHTML = [
                '<div style="min-height:100vh;background-color:#020617;color:#f8fafc;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;">',
                  '<div style="max-width:680px;width:100%;background-color:#0f172a;border:1px solid #dc2626;border-radius:16px;padding:32px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);text-align:center;">',
                    '<div style="display:inline-block;padding:12px;background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.4);border-radius:12px;margin-bottom:16px;">',
                      '<svg style="width:36px;height:36px;color:#ef4444;fill:none;stroke:currentColor;stroke-width:2;" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>',
                    '</div>',
                    '<h1 style="font-size:22px;font-weight:800;color:#ffffff;margin:0 0 8px 0;letter-spacing:-0.5px;">Chery Tunisie - STA Société Tunisienne Automobile</h1>',
                    '<div style="display:inline-block;background:#334155;color:#94a3b8;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:20px;text-transform:uppercase;letter-spacing:0.5px;">Navigateur Internet Explorer obsolète détecté sous Windows 8</div>',
                    '<p style="font-size:14px;line-height:1.6;color:#cbd5e1;margin:0 0 24px 0;">',
                      'L\'application commerciale Chery Tunisie utilise des technologies web modernes en temps réel (synchronisation des stocks de véhicules, calcul automatique des acomptes, génération et impression des bons de réservation) qui ne sont pas supportées par l\'ancien <strong>Internet Explorer</strong>.',
                    '</p>',
                    '<div style="background:#020617;border:1px solid #1e293b;border-radius:12px;padding:20px;text-align:left;margin-bottom:24px;">',
                      '<h3 style="font-size:13px;font-weight:700;color:#f59e0b;margin:0 0 12px 0;">👉 Solutions rapides pour ouvrir le site sous Windows 8 :</h3>',
                      '<ul style="margin:0;padding-left:20px;color:#94a3b8;font-size:13px;line-height:1.8;">',
                        '<li><strong style="color:#ffffff;">Google Chrome</strong> : Fonctionne parfaitement sous Windows 8 / 8.1.</li>',
                        '<li><strong style="color:#ffffff;">Mozilla Firefox ESR</strong> : Navigateur rapide et 100% compatible Windows 8.</li>',
                        '<li><strong style="color:#ffffff;">Microsoft Edge (Chromium)</strong> : Version moderne de Microsoft pour remplacer Internet Explorer.</li>',
                      '</ul>',
                    '</div>',
                    '<div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">',
                      '<a href="https://www.google.com/chrome/" target="_blank" rel="noopener noreferrer" style="background:#dc2626;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">Télécharger Google Chrome</a>',
                      '<a href="https://www.mozilla.org/fr/firefox/new/" target="_blank" rel="noopener noreferrer" style="background:#1e293b;border:1px solid #334155;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;">Télécharger Mozilla Firefox</a>',
                    '</div>',
                  '</div>',
                '</div>'
              ].join('');
            }
          });
        }

        // 6. Global error & white-screen watchdog
        window.addEventListener('error', function(e) {
          console.warn('Global application error caught:', e.message);
        });

        // 7. Watchdog timer: If root is completely blank after 8 seconds and not legacy IE, offer reload options
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && root.children.length === 0 && !window.__IS_LEGACY_BROWSER__) {
            root.innerHTML = [
              '<div style="min-height:100vh;background-color:#020617;color:#f8fafc;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box;">',
                '<div style="max-width:540px;width:100%;background-color:#0f172a;border:1px solid #334155;border-radius:16px;padding:28px;text-align:center;">',
                  '<h2 style="font-size:18px;font-weight:700;color:#f8fafc;margin:0 0 10px 0;">Chargement de Chery Tunisie...</h2>',
                  '<p style="font-size:13px;color:#94a3b8;line-height:1.5;margin:0 0 20px 0;">Le chargement prend plus de temps que prévu ou votre navigateur bloque certains scripts.</p>',
                  '<div style="display:flex;gap:10px;justify-content:center;">',
                    '<button onclick="window.location.reload()" style="background:#dc2626;color:#ffffff;border:none;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;">Recharger la page</button>',
                    '<button onclick="localStorage.clear();sessionStorage.clear();window.location.reload();" style="background:#1e293b;border:1px solid #475569;color:#e2e8f0;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;">Vider le cache</button>',
                  '</div>',
                '</div>',
              '</div>'
            ].join('');
          }
        }, 8000);
      })();
